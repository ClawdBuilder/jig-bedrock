# A tag publishes only a commit whose ci-ok check succeeded, and only when the tag names package.json's version. The tag
# is the release; there is no branch publish path.
name: Publish

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    checks: read
    id-token: write

jobs:
    publish:
        name: Publish
        runs-on: ubuntu-24.04
        timeout-minutes: 30
        steps:
            - name: Check out the tagged commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.ref_name }}
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: The tag and package.json agree
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  version="${TAG#v}"
                  package="$(node -p "require('./package.json').version")"
                  if [ "${version}" != "${package}" ]; then
                    echo "::error::tag ${TAG} does not name package.json's version ${package}"
                    exit 1
                  fi

            - name: Require ci-ok on the tagged commit
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?filter=latest" \
                    --jq '[.check_runs[] | select(.name == "ci-ok") | .conclusion] | join(",")')"
                  if [ "${conclusion}" != "success" ]; then
                    echo "::error::ci-ok on ${GITHUB_SHA} is '${conclusion:-not run}'; refusing to publish"
                    exit 1
                  fi

            - name: Publish to npm
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: npm publish --provenance --access public
