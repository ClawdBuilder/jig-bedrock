name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    checks:
        name: Checks (Node ${{ matrix.node }})
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        strategy:
            # All three lines finish, so a failure that is only on one Node version is seen next to the passes on the others.
            fail-fast: false
            matrix:
                # package.json says Node >=22.19.0; run the lowest allowed line, the previous LTS and the current one.
                node: ["22.19.0", "24", "26"]
        steps:
            - name: Check out the repository
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  # The commit-email guard reads origin/main..HEAD; a shallow checkout has no such range.
                  fetch-depth: 0

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: npm

            - name: Show the versions
              run: |
                  node --version
                  npm --version

            - name: Install dependencies
              run: npm ci

            - name: Commit email guard
              run: npm run check:emails

            - name: Scan for company strings
              run: npm run scan

            - name: Types and Biome
              run: npm run check

            - name: Tests
              run: npm test

    # One name for branch protection to require, whatever matrix entries there are: `ci-ok` is the check to require. It runs
    # even when a job failed or was cancelled, and fails unless every job it needs succeeded.
    ci-ok:
        name: ci-ok
        if: ${{ always() }}
        needs: [checks]
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions: {}
        steps:
            - name: Every job succeeded
              env:
                  NEEDS: ${{ toJSON(needs) }}
              run: |
                  echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
                  echo "$NEEDS" | jq -e 'to_entries | all(.value.result == "success")' > /dev/null
