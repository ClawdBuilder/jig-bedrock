# Exact dev pins, updated weekly: patch and minor updates arrive grouped, a major alone. Peer ranges are `*` in
# package.json, so Dependabot has no peer range to increase or rewrite; only the exact dev pins move. The cooldown lets a
# release age before it is proposed.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      versioning-strategy: increase
      cooldown:
          default-days: 3
          semver-patch-days: 3
          semver-minor-days: 3
          semver-major-days: 7
      labels:
          - dependencies
      groups:
          patch-and-minor:
              update-types:
                  - patch
                  - minor

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
          semver-patch-days: 3
          semver-minor-days: 3
          semver-major-days: 7
      labels:
          - dependencies
          - github-actions
      groups:
          patch-and-minor:
              update-types:
                  - patch
                  - minor
