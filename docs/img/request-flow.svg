<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-label="How a request runs. Pi sends a turn for a Claude model to the jig-bedrock provider. The provider picks the route for the model and signs the request with the credentials of your AWS profile. Claude Haiku 5.5, Sonnet 5.5, Opus 5.5 and Opus 4.8 use the Messages route, where a tool loaded in the middle of a session keeps the prompt cache. The other Claude models use the Converse route. Around the request: an expired sign-in is renewed and the request is sent once more; the models found in your AWS account are kept for 24 hours; the cost of each reply is added to this month&#x27;s record on this machine; Pi&#x27;s built-in Bedrock provider keeps working beside this one. The record feeds the footer, which shows the month&#x27;s spend and your budget, for example Nov $12.40 / $200, and the bedrock usage command." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="979" height="499" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="reqflow-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
    <marker id="reqflow-head-5c9cab-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C9CAB"/></marker>
  </defs>
  <!-- the turn, and the provider -->
  <rect x="30" y="50" width="170" height="64" rx="6" fill="#5D4B7C"/>
  <text x="115" y="78.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pi</text>
  <text x="115" y="95.0" font-size="12" fill="#FFFFFF" text-anchor="middle">a turn for a Claude model</text>
  <path d="M200 82 H270" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#reqflow-head-1d3b4d-11)"/>
  <text x="235" y="72" font-size="12" fill="#3A4440" text-anchor="middle">request</text>
  <rect x="270" y="34" width="230" height="96" rx="6" fill="#1D3B4D"/>
  <text x="385" y="61.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">jig-bedrock</text>
  <text x="385" y="78.0" font-size="12" fill="#FFFFFF" text-anchor="middle">picks the route for the model,</text>
  <text x="385" y="95.0" font-size="12" fill="#FFFFFF" text-anchor="middle">signs with the credentials</text>
  <text x="385" y="112.0" font-size="12" fill="#FFFFFF" text-anchor="middle">of your AWS profile</text>
  <rect x="580" y="34" width="370" height="64" rx="6" fill="#5C9CAB"/>
  <text x="765" y="53.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Messages route</text>
  <text x="765" y="70.5" font-size="12" fill="#FFFFFF" text-anchor="middle">Haiku 5.5, Sonnet 5.5, Opus 5.5, Opus 4.8</text>
  <text x="765" y="87.5" font-size="12" fill="#FFFFFF" text-anchor="middle">a tool loaded mid-session keeps the prompt cache</text>
  <rect x="580" y="112" width="370" height="64" rx="6" fill="#5C9CAB"/>
  <text x="765" y="131.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">Converse route</text>
  <text x="765" y="148.5" font-size="12" fill="#FFFFFF" text-anchor="middle">the other Claude models</text>
  <text x="765" y="165.5" font-size="12" fill="#FFFFFF" text-anchor="middle">same sign-in, same model list</text>
  <path d="M500 66 H580" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#reqflow-head-1d3b4d-11)"/>
  <text x="540" y="58" font-size="12" fill="#3A4440" text-anchor="middle">signed</text>
  <path d="M500 100 H540 V144 H580" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#reqflow-head-1d3b4d-11)"/>
  <!-- around every request -->
  <rect x="30" y="204" width="920" height="186" rx="6" fill="#E8ECEE"/>
  <text x="46" y="226" font-size="13" fill="#1A1F1D" font-weight="700">Around the request</text>
  <path d="M385 130 V204" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#reqflow-head-1d3b4d-11)"/>
  <text x="369" y="172" font-size="12" fill="#3A4440" text-anchor="end">each request</text>
  <rect x="45" y="244" width="210" height="110" rx="6" fill="#FBF5EA" stroke="#C08326" stroke-width="1.8"/>
  <text x="150" y="278.0" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">sign-in expired</text>
  <text x="150" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">the sign-in is renewed</text>
  <text x="150" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">(aws sso login), then the</text>
  <text x="150" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">request is sent once more</text>
  <rect x="275" y="244" width="210" height="110" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="380" y="278.0" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">models</text>
  <text x="380" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">found in your AWS account:</text>
  <text x="380" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">AWS-defined, by tag, or listed</text>
  <text x="380" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">kept for 24 hours</text>
  <rect x="505" y="244" width="210" height="110" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="610" y="278.0" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">spend</text>
  <text x="610" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">the cost of each reply</text>
  <text x="610" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">is added to this month&#x27;s</text>
  <text x="610" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">record on this machine</text>
  <rect x="735" y="244" width="210" height="110" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="840" y="278.0" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">Pi&#x27;s built-in Bedrock</text>
  <text x="840" y="295.0" font-size="12" fill="#3A4440" text-anchor="middle">left as it is: its models,</text>
  <text x="840" y="312.0" font-size="12" fill="#3A4440" text-anchor="middle">its sign-in and an API key</text>
  <text x="840" y="329.0" font-size="12" fill="#3A4440" text-anchor="middle">keep working beside this</text>
  <!-- the record feeds the footer and the usage command -->
  <path d="M610 354 V424" fill="none" stroke="#5C9CAB" stroke-width="2.4" marker-end="url(#reqflow-head-5c9cab-11)"/>
  <path d="M610 408 H817.5 V424" fill="none" stroke="#5C9CAB" stroke-width="2.4" marker-end="url(#reqflow-head-5c9cab-11)"/>
  <text x="594" y="412" font-size="12" fill="#3A4440" text-anchor="end">after each reply</text>
  <rect x="280" y="424" width="340" height="56" rx="6" fill="#5C9CAB"/>
  <text x="450" y="448.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the footer</text>
  <text x="450" y="465.0" font-size="12" fill="#FFFFFF" text-anchor="middle">Nov $12.40 / $200, coloured from 80% of the budget</text>
  <rect x="690" y="424" width="255" height="56" rx="6" fill="#5C9CAB"/>
  <text x="817.5" y="448.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">/bedrock usage</text>
  <text x="817.5" y="465.0" font-size="12" fill="#FFFFFF" text-anchor="middle">spend by model, day, week or month</text>
</svg>
