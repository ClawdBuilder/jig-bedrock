<svg xmlns="http://www.w3.org/2000/svg" width="880" height="282" viewBox="0 0 880 282" role="img" aria-label="Three sources feed the read-only AWS CLI: AWS-defined, by tag, and listed by hand. The catalog is kept 24 hours and fills /model. Refresh moments are session start, after login, opening /model, and /bedrock refresh." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
