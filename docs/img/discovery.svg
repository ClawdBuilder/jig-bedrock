-linejoin="round"><circle cx="714" cy="90" r="9"/><path d="M714 85 v6 h4"/></g><text class="tiny" x="714" y="66" text-anchor="middle">24 h</text><path class="line" d="M728 90 H748" stroke-width="2" marker-end="url(#discovery-arrow)"/><rect class="box" x="748" y="44" width="108" height="92" rx="14"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M797 65 h10 M797 70 h10 M797 75 h7"/><circle cx="795" cy="65" r="1" fill="currentColor"/><circle cx="795" cy="70" r="1" fill="currentColor"/><circle cx="795" cy="75" r="1" fill="currentColor"/></g><text class="small" x="802" y="108" text-anchor="middle">/model</text>
