<svg xmlns="http://www.w3.org/2000/svg" width="880" height="338" viewBox="0 0 880 338" role="img" aria-label="Three discovery sources feed the read-only AWS CLI: AWS-defined, by tag or listed by hand. It fills a catalog kept 24 hours, shown in /model. Four refresh moments are listed." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.75" y="0.75" width="878.5" height="336.5" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<defs><marker id="discovery-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#57606A"/></marker></defs><rect x="24" y="12" width="168" height="74" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="108" y="42" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="middle">AWS-defined</text><text x="108" y="64" font-size="12" fill="#24292F" text-anchor="middle">the default</text><path d="M192 49 H262" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#discovery-arrow)"/><rect x="24" y="88" width="168" height="74" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="108" y="118" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="middle">By tag</text><text x="108" y="140" font-size="12" fill="#24292F" text-anchor="middle">tagged profiles</text><path d="M192 125 H262" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#discovery-arrow)"/><rect x="24" y="164" width="168" height="74" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="108" y="194" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="middle">Listed by hand</text><text x="108" y="216" font-size="12" fill="#24292F" text-anchor="middle">ARNs or ids</text><path d="M192 201 H262" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#discovery-arrow)"/><rect x="262" y="44" width="160" height="140" rx="8" fill="#1D3B4D"/><text x="342" y="82" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">AWS CLI</text><text x="342" y="104" font-size="13" fill="#FFFFFF" text-anchor="middle">read only</text><text x="342" y="126" font-size="12" fill="#FFFFFF" text-anchor="middle">your AWS profile</text><path d="M422 114 H462" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#discovery-arrow)"/><text x="440" y="104" font-size="12" fill="#57606A" text-anchor="middle">saves</text><rect x="462" y="66" width="160" height="96" rx="8" fill="#5C9CAB"/><text x="542" y="101" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Catalog</text><text x="542" y="123" font-size="13" fill="#FFFFFF" text-anchor="middle">24 hours</text><circle cx="654" cy="114" r="18" fill="none" stroke="#57606A" stroke-width="2"/><path d="M654 104 V116 H664" fill="none" stroke="#57606A" stroke-width="2"/><text x="678" y="120" font-size="13" fill="#57606A" font-weight="700" text-anchor="start">24 h</text><path d="M700 114 H730" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#discovery-arrow)"/><rect x="730" y="72" width="126" height="84" rx="8" fill="#5D4B7C"/><text x="793" y="112" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">/model</text><text x="793" y="134" font-size="12" fill="#FFFFFF" text-anchor="middle">cached list</text><text x="10" y="260" font-size="13" fill="#24292F" font-weight="700" text-anchor="start">Refreshed at</text><rect x="10" y="274" width="212" height="52" rx="15" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="116" y="306" font-size="12" fill="#9A6212" font-weight="700" text-anchor="middle">session start, 24 h+</text><rect x="226" y="274" width="212" height="52" rx="15" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="332" y="306" font-size="12" fill="#9A6212" font-weight="700" text-anchor="middle">after /login</text><rect x="442" y="274" width="212" height="52" rx="15" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="548" y="306" font-size="12" fill="#9A6212" font-weight="700" text-anchor="middle">/model opens, 24 h+</text><rect x="658" y="274" width="212" height="52" rx="15" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="764" y="306" font-size="12" fill="#9A6212" font-weight="700" text-anchor="middle">/bedrock refresh, now</text>
</svg>
