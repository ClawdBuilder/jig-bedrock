x="576" y="87" font-size="15" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Catalog</text><circle cx="544" cy="111" r="8" fill="none" stroke="#FFFFFF" stroke-width="2"/><path d="M544 106 V112 H549" fill="none" stroke="#FFFFFF" stroke-width="2"/><text x="560" y="116" font-size="13" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="start">24 hours</text><path d="M658 95 H696" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#di-arrow)"/><rect x="696" y="59" width="150" height="72" rx="8" fill="#5D4B7C"/><text x="771" y="87" font-size="15" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">/model</text><text x="771" y="107" font-size="12" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">cached list</text><text x="24" y="190" font-size="13" fill="#24292F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="start">Refreshed at</text><rect x="24" y="206" width="198" height="52" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="123" y="228" font-size="13" fill="#9A6212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Session start</text><text x="123" y="246" font-size="12" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">if over 24 h</text><rect x="230" y="206" width="198" height="52" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="329" y="228" font-size="13" fill="#9A6212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">After /login</text><text x="329" y="246" font-size="12" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">always</text><rect x="436" y="206" width="198" height="52" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="535" y="228" font-size="13" fill="#9A6212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">/model opens</text><text x="535" y="246" font-size="12" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">if over 24 h</text><rect x="642" y="206" width="198" height="52" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="741" y="228" font-size="13" fill="#9A6212" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">/bedrock refresh</text><text x="741" y="246" font-size="12" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">right now</text>
