<svg xmlns="http://www.w3.org/2000/svg" width="980" height="452" viewBox="0 0 980 452" role="img" aria-label="How the models are found. There are three ways. AWS-defined, the default: every Claude inference profile AWS defines in your regions, found with one account check and a listing call per region. By tag: the application inference profiles that carry your tag, found with an account check, a tag listing per region and one read for each. Listed by hand: the inference profiles you name in the settings, found with an account check and one read for each. All three run the AWS CLI with your AWS profile and only read; no secret is stored. The result is the catalog, the file catalog.json in the cache folder jig-bedrock, kept for 24 hours, and it fills the model list of Pi. A refresh runs at session start when the catalog is over 24 hours old, after login, and when you run bedrock refresh." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="979" height="451" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="discovery-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
    <marker id="discovery-head-5c9cab-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5C9CAB"/></marker>
  </defs>
  <!-- three ways to find the models -->
  <rect x="30" y="30" width="330" height="80" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="195" y="57.5" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">AWS-defined (the default)</text>
  <text x="195" y="74.5" font-size="12" fill="#3A4440" text-anchor="middle">every Claude model AWS defines in your regions</text>
  <text x="195" y="91.5" font-size="12" fill="#3A4440" text-anchor="middle">account check + a listing call per region</text>
  <rect x="30" y="124" width="330" height="80" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="195" y="151.5" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">by tag</text>
  <text x="195" y="168.5" font-size="12" fill="#3A4440" text-anchor="middle">application inference profiles with your tag</text>
  <text x="195" y="185.5" font-size="12" fill="#3A4440" text-anchor="middle">account check + tag listing + a read each</text>
  <rect x="30" y="218" width="330" height="80" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="195" y="245.5" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">listed by hand</text>
  <text x="195" y="262.5" font-size="12" fill="#3A4440" text-anchor="middle">inference profiles you name in settings</text>
  <text x="195" y="279.5" font-size="12" fill="#3A4440" text-anchor="middle">account check + a read each</text>
  <!-- the AWS CLI does the reading -->
  <rect x="440" y="104" width="200" height="120" rx="6" fill="#1D3B4D"/>
  <text x="540" y="143.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">AWS CLI</text>
  <text x="540" y="160.0" font-size="12" fill="#FFFFFF" text-anchor="middle">runs with your AWS profile</text>
  <text x="540" y="177.0" font-size="12" fill="#FFFFFF" text-anchor="middle">reads only</text>
  <text x="540" y="194.0" font-size="12" fill="#FFFFFF" text-anchor="middle">no secret is stored</text>
  <path d="M360 70 H400 V134 H440" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#discovery-head-1d3b4d-11)"/>
  <path d="M360 164 H440" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#discovery-head-1d3b4d-11)"/>
  <path d="M360 258 H400 V194 H440" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#discovery-head-1d3b4d-11)"/>
  <text x="400" y="156" font-size="12" fill="#3A4440" text-anchor="middle">calls</text>
  <!-- the catalog -->
  <rect x="720" y="104" width="230" height="120" rx="6" fill="#5C9CAB"/>
  <text x="835" y="143.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">the catalog</text>
  <text x="835" y="160.0" font-size="12" fill="#FFFFFF" text-anchor="middle">~/.cache/jig-bedrock/</text>
  <text x="835" y="177.0" font-size="12" fill="#FFFFFF" text-anchor="middle">catalog.json</text>
  <text x="835" y="194.0" font-size="12" fill="#FFFFFF" text-anchor="middle">kept for 24 hours</text>
  <path d="M640 164 H720" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#discovery-head-1d3b4d-11)"/>
  <text x="680" y="156" font-size="12" fill="#3A4440" text-anchor="middle">models</text>
  <rect x="720" y="262" width="230" height="64" rx="6" fill="#5D4B7C"/>
  <text x="835" y="290.0" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">/model in Pi</text>
  <text x="835" y="307.0" font-size="12" fill="#FFFFFF" text-anchor="middle">claude-sonnet-5-5, …</text>
  <path d="M835 224 V262" fill="none" stroke="#5C9CAB" stroke-width="2.4" marker-end="url(#discovery-head-5c9cab-11)"/>
  <text x="851" y="248" font-size="12" fill="#3A4440">fills the list</text>
  <!-- when a refresh runs -->
  <rect x="30" y="344" width="920" height="88" rx="6" fill="#E8ECEE"/>
  <text x="46" y="366" font-size="13" fill="#1A1F1D" font-weight="700">A refresh runs</text>
  <rect x="45" y="378" width="290" height="40" rx="6" fill="#FBF5EA" stroke="#C08326" stroke-width="1.8"/>
  <text x="190" y="402.5" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">at session start, if over 24 hours old</text>
  <rect x="345" y="378" width="290" height="40" rx="6" fill="#FBF5EA" stroke="#C08326" stroke-width="1.8"/>
  <text x="490" y="402.5" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">after /login</text>
  <rect x="645" y="378" width="290" height="40" rx="6" fill="#FBF5EA" stroke="#C08326" stroke-width="1.8"/>
  <text x="790" y="402.5" font-size="13" fill="#8A5A12" font-weight="700" text-anchor="middle">when you run /bedrock refresh</text>
</svg>
