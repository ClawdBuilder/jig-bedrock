<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-label="A Claude model reaches a gate that asks whether Pi says tool changes work. Yes goes to Messages and keeps the cache; no goes to Converse like Pi built-in." font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<style>
.canvas { fill: #ffffff; stroke: #e6e6e6; }
text { fill: #17171a; }
.box { fill: #ffffff; stroke: #c1c3cd; }
.label { fill: #17171a; }
.muted { fill: #6b6b70; }
.accent { fill: #0e7c86; }
.accent-stroke { stroke: #0e7c86; fill: none; }
.line { stroke: #0e7c86; fill: none; }
.branch { stroke: #c1c3cd; fill: none; }
.return { stroke: #c1c3cd; fill: none; }
.chip { fill: #ffffff; stroke: #c1c3cd; }
.icon { stroke: #0e7c86; fill: none; }
.marker-accent { fill: #0e7c86; }
.marker-branch { fill: #c1c3cd; }
.good { fill: #1a7f37; }
.bad { fill: #cf222e; }
.chip-good { fill: #ffffff; stroke: #1a7f37; }
.chip-bad { fill: #ffffff; stroke: #cf222e; }
.bar-neutral { fill: #c1c3cd; stroke: none; }
.title { font-size: 15px; font-weight: 600; }
.small { font-size: 12.5px; font-weight: 500; }
.tiny { font-size: 12px; font-weight: 500; }
.chip-text { font-size: 12.5px; font-weight: 500; }
@media (prefers-color-scheme: dark) {
  .canvas { fill: #0f1014; stroke: #30313a; }
  text { fill: #f4f4f5; }
  .box { fill: #15161b; stroke: #4a4c53; }
  .label { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .accent { fill: #4fd1c5; }
  .accent-stroke { stroke: #4fd1c5; }
  .line { stroke: #4fd1c5; }
  .branch { stroke: #4a4c53; }
  .return { stroke: #4a4c53; }
  .chip { fill: #15161b; stroke: #4a4c53; }
  .icon { stroke: #4fd1c5; }
  .marker-accent { fill: #4fd1c5; }
  .marker-branch { fill: #4a4c53; }
  .good { fill: #3fb950; }
  .bad { fill: #f85149; }
  .chip-good { fill: #15161b; stroke: #3fb950; }
  .chip-bad { fill: #15161b; stroke: #f85149; }
  .bar-neutral { fill: #4a4c53; stroke: none; }
}
</style>
<defs>
<marker id="routes-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="marker-accent" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="routes-branch" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-branch" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="canvas" x="1" y="1" width="878" height="188" rx="14"/>
<path class="line" d="M186 94 H228" stroke-width="2"/><rect class="box" x="228" y="80" width="36" height="28" rx="9"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M243 91 a3 3 0 0 1 6 0 c0 2 -3 3 -3 5"/><circle cx="246" cy="101" r="1.2" fill="currentColor"/></g><text class="tiny" x="246" y="70" text-anchor="middle">tool changes?</text><path class="line" d="M266 94 H310 V54 H340" stroke-width="2" marker-end="url(#routes-arrow)"/><text class="tiny" x="300" y="46" text-anchor="middle">yes</text><path class="branch" d="M266 94 H310 V134 H340" stroke-width="2" marker-end="url(#routes-branch)"/><text class="tiny" x="300" y="126" text-anchor="middle">no</text><rect class="box" x="24" y="54" width="160" height="80" rx="14"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M104 75 l8 4 v8 l-8 4 -8 -4 v-8 z M104 75 v8 M96 79 l8 4 8 -4"/></g><text class="small" x="104" y="120" text-anchor="middle">Claude model</text><rect class="box" x="340" y="24" width="380" height="60" rx="14"/><text class="title" x="358" y="50" text-anchor="start">Messages</text><text class="tiny" x="358" y="68" text-anchor="start">four Claude models</text><rect class="chip-good" x="574" y="36" width="130" height="32" rx="16"/><text class="chip-text good" x="639" y="57" text-anchor="middle">cache kept</text><rect class="box" x="340" y="104" width="380" height="60" rx="14"/><text class="title" x="358" y="130" text-anchor="start">Converse</text><text class="tiny" x="358" y="148" text-anchor="start">other Claude models</text><rect class="chip" x="574" y="116" width="130" height="32" rx="16"/><text class="chip-text muted" x="639" y="137" text-anchor="middle">as Pi built-in</text>
</svg>
