<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-label="A question asks whether Pi lists mid-session tool changes. Yes goes to Messages and keeps the cache; no goes to Converse." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.75" y="0.75" width="878.5" height="246.5" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<defs><marker id="routes-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#57606A"/></marker></defs><rect x="28" y="80" width="190" height="60" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><text x="123" y="108" font-size="13" fill="#24292F" font-weight="700" text-anchor="middle">Pi says tool changes work?</text><path d="M218 110 H300" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#routes-arrow)"/><text x="252" y="76" font-size="12" fill="#57606A" text-anchor="middle">yes</text><path d="M218 110 H300" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#routes-arrow)"/><text x="254" y="162" font-size="12" fill="#57606A" text-anchor="middle">no</text><rect x="300" y="24" width="550" height="104" rx="10" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="320" y="66" font-size="15" fill="#2E7D4F" font-weight="700" text-anchor="start">Messages route</text><text x="320" y="88" font-size="13" fill="#24292F" text-anchor="start">Haiku 5.5 · Sonnet 5.5 · Opus 5.5 · Opus 4.8</text><text x="320" y="108" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="start">cache kept</text><rect x="300" y="144" width="550" height="88" rx="10" fill="#F8E4E1" stroke="#B03A2E" stroke-width="1.5"/><text x="320" y="176" font-size="15" fill="#B03A2E" font-weight="700" text-anchor="start">Converse route</text><text x="320" y="198" font-size="13" fill="#24292F" text-anchor="start">every other Claude model · as Pi built-in</text>
