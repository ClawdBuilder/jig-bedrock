<svg xmlns="http://www.w3.org/2000/svg" width="880" height="122" viewBox="0 0 880 122" role="img" aria-label="Four steps: install, sign in, pick a model, check. A green check ends at Bedrock is ready." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.75" y="0.75" width="878.5" height="120.5" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<defs><marker id="setup-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#57606A"/></marker></defs><circle cx="53" cy="50" r="18" fill="#1D3B4D"/><text x="53" y="55" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">1</text><text x="80" y="44" font-size="15" fill="#24292F" font-weight="700" text-anchor="start">Install</text><text x="80" y="64" font-size="12" fill="#57606A" text-anchor="start">pi install</text><path d="M196 50 H218" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#setup-arrow)"/><circle cx="251" cy="50" r="18" fill="#1D3B4D"/><text x="251" y="55" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">2</text><text x="278" y="44" font-size="15" fill="#24292F" font-weight="700" text-anchor="start">Sign in</text><text x="278" y="64" font-size="12" fill="#57606A" text-anchor="start">/login</text><path d="M394 50 H416" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#setup-arrow)"/><circle cx="449" cy="50" r="18" fill="#1D3B4D"/><text x="449" y="55" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">3</text><text x="476" y="44" font-size="15" fill="#24292F" font-weight="700" text-anchor="start">Pick a model</text><text x="476" y="64" font-size="12" fill="#57606A" text-anchor="start">/model</text><path d="M592 50 H614" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#setup-arrow)"/><circle cx="647" cy="50" r="18" fill="#1D3B4D"/><text x="647" y="55" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">4</text><text x="674" y="44" font-size="15" fill="#24292F" font-weight="700" text-anchor="start">Check</text><text x="674" y="64" font-size="12" fill="#57606A" text-anchor="start">/bedrock doctor</text><rect x="778" y="10" width="80" height="80" rx="40" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="818" y="62" font-size="28" fill="#2E7D4F" font-weight="700" text-anchor="middle">✓</text><text x="818" y="104" font-size="12" fill="#2E7D4F" text-anchor="middle">Bedrock is ready.</text>
</svg>
