606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">/model</text><path d="M508 42 H547" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#su-arrow)"/><circle cx="615" cy="42" r="18" fill="#1D3B4D"/><text x="615" y="47" font-size="15" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">4</text><text x="615" y="78" font-size="15" fill="#24292F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Check</text><text x="615" y="96" font-size="12" fill="#57606A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">/bedrock doctor</text><path d="M683 42 H722" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#su-arrow)"/><circle cx="790" cy="42" r="18" fill="#2E7D4F"/><path d="M782 42 l5 5 11 -11" fill="none" stroke="#FFFFFF" stroke-width="2.5"/><text x="790" y="78" font-size="15" fill="#2E7D4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Ready</text><text x="790" y="96" font-size="12" fill="#2E7D4F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">Bedrock is ready.</text>
