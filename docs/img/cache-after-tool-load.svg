<svg xmlns="http://www.w3.org/2000/svg" width="980" height="452" viewBox="0 0 980 452" role="img" aria-label="What one tool load costs on each route. One session, three model calls, a prompt of about 34,000 tokens. Call 1 writes the prompt to the cache on both routes. Then tool_search loads a tool. On the Messages route, which jig-bedrock uses, the loaded tool is sent inside the conversation, so call 2 reads 34,216 tokens from the cache and writes 275. On the Converse route, which Pi&#x27;s built-in provider uses, the tool list at the front of the request changes, so call 2 reads nothing from the cache and writes the whole prompt again, 34,463 tokens. Call 3 reads from the cache on both. The session cost 0.0051 dollars on Messages and 0.0099 dollars on Converse." font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">
  <rect x="0.5" y="0.5" width="979" height="451" rx="10" fill="#FAFBFA" stroke="#D2D9D3"/>
  <defs>
    <marker id="cacheload-head-1d3b4d-11" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D3B4D"/></marker>
  </defs>
  <!-- the Messages route -->
  <rect x="30" y="28" width="920" height="178" rx="6" fill="#E8ECEE"/>
  <text x="46" y="52" font-size="13" fill="#1A1F1D" font-weight="700">Messages route (jig-bedrock)</text>
  <text x="934" y="52" font-size="13" fill="#1A1F1D" font-weight="700" text-anchor="end">session cost $0.0051</text>
  <rect x="45" y="70" width="220" height="92" rx="6" fill="#5C9CAB"/>
  <text x="155" y="103.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">call 1</text>
  <text x="155" y="120.5" font-size="12" fill="#FFFFFF" text-anchor="middle">writes the prompt to the cache</text>
  <text x="155" y="137.5" font-size="12" fill="#FFFFFF" text-anchor="middle">about 34,000 tokens</text>
  <path d="M265 116 H380" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#cacheload-head-1d3b4d-11)"/>
  <text x="322.5" y="106" font-size="12" fill="#3A4440" text-anchor="middle">a tool is loaded</text>
  <rect x="380" y="70" width="220" height="92" rx="6" fill="#E2F1E7" stroke="#2C7A4B" stroke-width="1.8"/>
  <text x="490" y="103.5" font-size="13" fill="#2C7A4B" font-weight="700" text-anchor="middle">call 2</text>
  <text x="490" y="120.5" font-size="12" fill="#3A4440" text-anchor="middle">reads 34,216 from the cache</text>
  <text x="490" y="137.5" font-size="12" fill="#3A4440" text-anchor="middle">writes 275</text>
  <path d="M600 116 H715" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#cacheload-head-1d3b4d-11)"/>
  <text x="657.5" y="106" font-size="12" fill="#3A4440" text-anchor="middle">the tool is called</text>
  <rect x="715" y="70" width="220" height="92" rx="6" fill="#5C9CAB"/>
  <text x="825" y="103.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">call 3</text>
  <text x="825" y="120.5" font-size="12" fill="#FFFFFF" text-anchor="middle">reads the prompt</text>
  <text x="825" y="137.5" font-size="12" fill="#FFFFFF" text-anchor="middle">from the cache</text>
  <text x="46" y="188" font-size="12" fill="#3A4440">The loaded tool is sent inside the conversation. The front of the request stays the same, so the cache still matches.</text>
  <!-- the Converse route -->
  <rect x="30" y="222" width="920" height="178" rx="6" fill="#E8ECEE"/>
  <text x="46" y="246" font-size="13" fill="#1A1F1D" font-weight="700">Converse route (Pi&#x27;s built-in provider)</text>
  <text x="934" y="246" font-size="13" fill="#1A1F1D" font-weight="700" text-anchor="end">session cost $0.0099</text>
  <rect x="45" y="264" width="220" height="92" rx="6" fill="#5C9CAB"/>
  <text x="155" y="297.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">call 1</text>
  <text x="155" y="314.5" font-size="12" fill="#FFFFFF" text-anchor="middle">writes the prompt to the cache</text>
  <text x="155" y="331.5" font-size="12" fill="#FFFFFF" text-anchor="middle">about 34,000 tokens</text>
  <path d="M265 310 H380" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#cacheload-head-1d3b4d-11)"/>
  <text x="322.5" y="300" font-size="12" fill="#3A4440" text-anchor="middle">a tool is loaded</text>
  <rect x="380" y="264" width="220" height="92" rx="6" fill="#F7E4DF" stroke="#A93C27" stroke-width="1.8"/>
  <text x="490" y="297.5" font-size="13" fill="#A93C27" font-weight="700" text-anchor="middle">call 2</text>
  <text x="490" y="314.5" font-size="12" fill="#3A4440" text-anchor="middle">reads 0 from the cache</text>
  <text x="490" y="331.5" font-size="12" fill="#3A4440" text-anchor="middle">writes 34,463: the whole prompt again</text>
  <path d="M600 310 H715" fill="none" stroke="#1D3B4D" stroke-width="2.4" marker-end="url(#cacheload-head-1d3b4d-11)"/>
  <text x="657.5" y="300" font-size="12" fill="#3A4440" text-anchor="middle">the tool is called</text>
  <rect x="715" y="264" width="220" height="92" rx="6" fill="#5C9CAB"/>
  <text x="825" y="297.5" font-size="13" fill="#FFFFFF" font-weight="700" text-anchor="middle">call 3</text>
  <text x="825" y="314.5" font-size="12" fill="#FFFFFF" text-anchor="middle">reads the prompt</text>
  <text x="825" y="331.5" font-size="12" fill="#FFFFFF" text-anchor="middle">from the cache</text>
  <text x="46" y="382" font-size="12" fill="#3A4440">The loaded tool joins the tool list at the front of the request. Everything after it no longer matches the cache.</text>
  <text x="46" y="428" font-size="12" fill="#3A4440">Measured on AWS on 2026-11-10: Claude Haiku 5.5, a prompt of about 34,000 tokens, one tool loaded with tool_search.</text>
</svg>
