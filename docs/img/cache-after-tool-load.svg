<svg xmlns="http://www.w3.org/2000/svg" width="880" height="224" viewBox="0 0 880 224" role="img" aria-label="Bar chart of one session on two routes. After a tool load jig-bedrock writes 275 tokens to the cache and Pi built-in writes 34,463. Session costs are $0.0051 and $0.0099." font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<style>
.canvas { fill: #ffffff; stroke: #e6e6e6; }
text { fill: #17171a; }
.box { fill: #ffffff; stroke: #c1c3cd; }
.label { fill: #17171a; }
.muted { fill: #6b6b70; }
.accent { fill: #0e7c86; }
.accent-stroke { stroke: #0e7c86; fill: none; }
.line { stroke: #0e7c86; fill: none; }
.branch { stroke: #c1c3cd; fill: none; }
.return { stroke: #c1c3cd; fill: none; }
.chip { fill: #ffffff; stroke: #c1c3cd; }
.icon { stroke: #0e7c86; fill: none; }
.marker-accent { fill: #0e7c86; }
.marker-branch { fill: #c1c3cd; }
.good { fill: #1a7f37; }
.bad { fill: #cf222e; }
.chip-good { fill: #ffffff; stroke: #1a7f37; }
.chip-bad { fill: #ffffff; stroke: #cf222e; }
.bar-neutral { fill: #c1c3cd; stroke: none; }
.title { font-size: 15px; font-weight: 600; }
.small { font-size: 12.5px; font-weight: 500; }
.tiny { font-size: 12px; font-weight: 500; }
.chip-text { font-size: 12.5px; font-weight: 500; }
@media (prefers-color-scheme: dark) {
  .canvas { fill: #0f1014; stroke: #30313a; }
  text { fill: #f4f4f5; }
  .box { fill: #15161b; stroke: #4a4c53; }
  .label { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .accent { fill: #4fd1c5; }
  .accent-stroke { stroke: #4fd1c5; }
  .line { stroke: #4fd1c5; }
  .branch { stroke: #4a4c53; }
  .return { stroke: #4a4c53; }
  .chip { fill: #15161b; stroke: #4a4c53; }
  .icon { stroke: #4fd1c5; }
  .marker-accent { fill: #4fd1c5; }
  .marker-branch { fill: #4a4c53; }
  .good { fill: #3fb950; }
  .bad { fill: #f85149; }
  .chip-good { fill: #15161b; stroke: #3fb950; }
  .chip-bad { fill: #15161b; stroke: #f85149; }
  .bar-neutral { fill: #4a4c53; stroke: none; }
}
</style>
<defs>
<marker id="cache-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="marker-accent" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="cache-branch" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-branch" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="canvas" x="1" y="1" width="878" height="222" rx="14"/>
<text class="title" x="24" y="38" text-anchor="start">One session, two routes</text><rect class="accent" x="530" y="26" width="12" height="12" rx="3"/><text class="small" x="548" y="37" text-anchor="start">jig-bedrock (Messages)</text><rect class="bar-neutral" x="710" y="26" width="12" height="12" rx="3"/><text class="small" x="728" y="37" text-anchor="start">Pi built-in (Converse)</text><text class="small" x="24" y="88" text-anchor="start">Cache write after</text><text class="small" x="24" y="104" text-anchor="start">a tool load</text><rect class="accent" x="250" y="74" width="4" height="22" rx="3"/><text class="small accent" x="262" y="90" text-anchor="start">275 tokens</text><rect class="bar-neutral" x="250" y="106" width="500" height="22" rx="3"/><text class="small muted" x="758" y="122" text-anchor="start">34,463 tokens</text><text class="small" x="24" y="162" text-anchor="start">Session cost</text><rect class="accent" x="250" y="146" width="258" height="22" rx="3"/><text class="small accent" x="516" y="162" text-anchor="start">$0.0051</text><rect class="bar-neutral" x="250" y="178" width="500" height="22" rx="3"/><text class="small muted" x="758" y="194" text-anchor="start">$0.0099</text>
</svg>
