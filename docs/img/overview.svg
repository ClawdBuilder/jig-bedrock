<svg xmlns="http://www.w3.org/2000/svg" width="880" height="250" viewBox="0 0 880 250" role="img" aria-label="Pi sends a request through jig-bedrock to Amazon Bedrock. Four chips show model discovery, SSO renewal, prompt cache and footer spend." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.75" y="0.75" width="878.5" height="248.5" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<defs><marker id="overview-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#57606A"/></marker></defs><rect x="28" y="62" width="180" height="88" rx="10" fill="#5D4B7C"/><text x="118" y="98" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Pi</text><text x="118" y="120" font-size="13" fill="#FFFFFF" text-anchor="middle">coding agent</text><rect x="280" y="52" width="300" height="108" rx="10" fill="#1D3B4D"/><text x="430" y="86" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">jig-bedrock</text><text x="430" y="108" font-size="13" fill="#FFFFFF" text-anchor="middle">Bedrock for Pi</text><rect x="660" y="62" width="192" height="88" rx="10" fill="#5C9CAB"/><text x="756" y="98" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">Amazon Bedrock</text><text x="756" y="120" font-size="13" fill="#FFFFFF" text-anchor="middle">Claude models</text><path d="M208 106 H280" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="244" y="96" font-size="12" fill="#57606A" text-anchor="middle">request</text><path d="M580 106 H660" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#overview-arrow)"/><text x="620" y="96" font-size="12" fill="#57606A" text-anchor="middle">signed</text><rect x="30" y="170" width="200" height="72" rx="17" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="50" y="200" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="start">◆</text><text x="72" y="200" font-size="13" fill="#24292F" text-anchor="start">Finds your models</text><rect x="240" y="170" width="200" height="72" rx="17" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="260" y="200" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="start">↻</text><text x="282" y="200" font-size="13" fill="#24292F" text-anchor="start">Renews SSO sign-in</text><rect x="450" y="170" width="200" height="72" rx="17" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="470" y="200" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="start">▣</text><text x="492" y="200" font-size="13" fill="#24292F" text-anchor="start">Keeps the cache</text><rect x="660" y="170" width="200" height="72" rx="17" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="680" y="200" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="start">●</text><text x="702" y="200" font-size="13" fill="#24292F" text-anchor="start">Spend in the footer</text>
