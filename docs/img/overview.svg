<svg xmlns="http://www.w3.org/2000/svg" width="880" height="276" viewBox="0 0 880 276" role="img" aria-label="Pi sends a request to jig-bedrock, which signs it with your AWS profile for Amazon Bedrock. Four branches show model discovery, SSO renewal, prompt cache and footer spend." font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
