<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="A request asks whether the SSO sign-in expired. If yes, aws sso login opens a browser and the request is sent once more, never a third time." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.75" y="0.75" width="878.5" height="212.5" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<defs><marker id="signin-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L10 4 L0 8 z" fill="#57606A"/></marker></defs><rect x="24" y="76" width="120" height="74" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><text x="84" y="109" font-size="15" fill="#24292F" font-weight="700" text-anchor="middle">Request</text><text x="84" y="127" font-size="12" fill="#57606A" text-anchor="middle">one turn</text><path d="M144 113 H206" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#signin-arrow)"/><rect x="206" y="74" width="150" height="78" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="281" y="110" font-size="15" fill="#9A6212" font-weight="700" text-anchor="middle">SSO expired?</text><text x="281" y="128" font-size="12" fill="#57606A" text-anchor="middle">yes</text><path d="M356 113 H424" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#signin-arrow)"/><rect x="424" y="66" width="196" height="94" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="522" y="108" font-size="15" fill="#9A6212" font-weight="700" text-anchor="middle">aws sso login</text><text x="522" y="128" font-size="12" fill="#24292F" text-anchor="middle">browser opens</text><path d="M588 142 q14 -14 28 0" fill="none" stroke="#9A6212" stroke-width="2"/><circle cx="602" cy="136" r="10" fill="none" stroke="#9A6212" stroke-width="2"/><path d="M620 113 H626" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#signin-arrow)"/><rect x="626" y="72" width="154" height="82" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="703" y="112" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="middle">sent once more</text><path d="M780 113 H794" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#signin-arrow)"/><rect x="794" y="72" width="76" height="82" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="832" y="112" font-size="13" fill="#2E7D4F" font-weight="700" text-anchor="middle">Reply</text><text x="440" y="192" font-size="12" fill="#57606A" text-anchor="middle">never a third time</text>
</svg>
