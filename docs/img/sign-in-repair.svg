<svg xmlns="http://www.w3.org/2000/svg" width="880" height="128" viewBox="0 0 880 128" role="img" aria-label="A request asks whether the SSO sign-in expired. If yes, aws sso login opens a browser and the request is sent once more, then a reply arrives. Never a third time." font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<rect x="0.75" y="0.75" width="878.5" height="126.5" rx="12" fill="#FFFFFF" stroke="#D0D7DE" stroke-width="1.5"/>
<defs><marker id="si-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#57606A"/></marker></defs><rect x="24" y="24" width="110" height="64" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><text x="79" y="55" font-size="15" fill="#24292F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Request</text><text x="79" y="75" font-size="12" fill="#24292F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">one turn</text><path d="M136 56 H172" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#si-arrow)"/><rect x="174" y="24" width="146" height="64" rx="8" fill="#F6F8FA" stroke="#D0D7DE" stroke-width="1.5"/><text x="247" y="61" font-size="15" fill="#24292F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">SSO expired?</text><path d="M322 56 H374" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#si-arrow)"/><text x="348" y="50" font-size="12" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">yes</text><rect x="376" y="24" width="150" height="64" rx="8" fill="#FDF5E6" stroke="#9A6212" stroke-width="1.5"/><text x="451" y="52" font-size="13" fill="#9A6212" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700" text-anchor="middle">aws sso login</text><rect x="396" y="60" width="16" height="14" fill="none" stroke="#9A6212" stroke-width="2"/><path d="M396 65 H412" stroke="#9A6212" stroke-width="2"/><circle cx="400" cy="62.5" r="1" fill="#9A6212"/><text x="461" y="72" font-size="12" fill="#24292F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">browser opens</text><path d="M528 56 H564" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#si-arrow)"/><rect x="566" y="24" width="166" height="64" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="649" y="61" font-size="15" fill="#2E7D4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Sent once more</text><path d="M734 56 H770" fill="none" stroke="#57606A" stroke-width="2" marker-end="url(#si-arrow)"/><rect x="772" y="24" width="84" height="64" rx="8" fill="#E3F1E7" stroke="#2E7D4F" stroke-width="1.5"/><text x="814" y="61" font-size="15" fill="#2E7D4F" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-weight="700" text-anchor="middle">Reply</text><text x="649" y="110" font-size="12" fill="#57606A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" text-anchor="middle">never a third time</text>
</svg>
