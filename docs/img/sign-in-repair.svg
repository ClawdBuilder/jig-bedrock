<svg xmlns="http://www.w3.org/2000/svg" width="880" height="128" viewBox="0 0 880 128" role="img" aria-label="A request asks whether the SSO sign-in expired. If so, aws sso login opens a browser, the request is sent again, then a green reply or a red error. Never a third time." font-family="Segoe UI, system-ui, -apple-system, Helvetica, Arial, sans-serif">
<style>
.canvas { fill: #ffffff; stroke: #e6e6e6; }
text { fill: #17171a; }
.box { fill: #ffffff; stroke: #c1c3cd; }
.label { fill: #17171a; }
.muted { fill: #6b6b70; }
.accent { fill: #0e7c86; }
.accent-stroke { stroke: #0e7c86; fill: none; }
.line { stroke: #0e7c86; fill: none; }
.branch { stroke: #c1c3cd; fill: none; }
.return { stroke: #c1c3cd; fill: none; }
.chip { fill: #ffffff; stroke: #c1c3cd; }
.icon { stroke: #0e7c86; fill: none; }
.marker-accent { fill: #0e7c86; }
.marker-branch { fill: #c1c3cd; }
.good { fill: #1a7f37; }
.bad { fill: #cf222e; }
.chip-good { fill: #ffffff; stroke: #1a7f37; }
.chip-bad { fill: #ffffff; stroke: #cf222e; }
.bar-neutral { fill: #c1c3cd; stroke: none; }
.title { font-size: 15px; font-weight: 600; }
.small { font-size: 12.5px; font-weight: 500; }
.tiny { font-size: 12px; font-weight: 500; }
.chip-text { font-size: 12.5px; font-weight: 500; }
@media (prefers-color-scheme: dark) {
  .canvas { fill: #0f1014; stroke: #30313a; }
  text { fill: #f4f4f5; }
  .box { fill: #15161b; stroke: #4a4c53; }
  .label { fill: #f4f4f5; }
  .muted { fill: #a1a1aa; }
  .accent { fill: #4fd1c5; }
  .accent-stroke { stroke: #4fd1c5; }
  .line { stroke: #4fd1c5; }
  .branch { stroke: #4a4c53; }
  .return { stroke: #4a4c53; }
  .chip { fill: #15161b; stroke: #4a4c53; }
  .icon { stroke: #4fd1c5; }
  .marker-accent { fill: #4fd1c5; }
  .marker-branch { fill: #4a4c53; }
  .good { fill: #3fb950; }
  .bad { fill: #f85149; }
  .chip-good { fill: #15161b; stroke: #3fb950; }
  .chip-bad { fill: #15161b; stroke: #f85149; }
  .bar-neutral { fill: #4a4c53; stroke: none; }
}
</style>
<defs>
<marker id="sign-in-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path class="marker-accent" d="M0,0 L10,5 L0,10 z"/></marker>
<marker id="sign-in-branch" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="marker-branch" d="M0,0 L10,5 L0,10 z"/></marker>
</defs>
<rect class="canvas" x="1" y="1" width="878" height="126" rx="14"/>
<path class="line" d="M154 64 H184" stroke-width="2"/><rect class="box" x="184" y="50" width="32" height="28" rx="9"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="200" cy="64" r="9"/><path d="M200 59 v6 h4"/></g><text class="tiny" x="200" y="42" text-anchor="middle">SSO expired</text><path class="line" d="M216 64 H244" stroke-width="2" marker-end="url(#sign-in-arrow)"/><rect class="box" x="24" y="24" width="130" height="80" rx="14"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M82 52 l14 -7 -4 14 -4 -5 z"/><path d="M88 54 l4 -4"/></g><text class="small" x="89" y="88" text-anchor="middle">Request</text><rect class="box" x="246" y="24" width="180" height="80" rx="14"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="328" y="45" width="16" height="13" rx="2"/><path d="M328 50 h16"/><circle cx="331" cy="47.5" r="1" fill="currentColor"/></g><text class="small" x="336" y="80" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">aws sso login</text><text class="tiny muted" x="336" y="96" text-anchor="middle">browser opens</text><path class="line" d="M426 64 H464" stroke-width="2" marker-end="url(#sign-in-arrow)"/><rect class="box" x="466" y="24" width="140" height="80" rx="14"/><g class="icon" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M529 52 l14 -7 -4 14 -4 -5 z"/><path d="M535 54 l4 -4"/></g><text class="small" x="536" y="88" text-anchor="middle">Sent again</text><path class="line" d="M606 64 H710" stroke-width="2" marker-end="url(#sign-in-arrow)"/><rect class="chip-good" x="712" y="42" width="68" height="36" rx="18"/><text class="chip-text good" x="746" y="65" text-anchor="middle">reply</text><rect class="chip-bad" x="788" y="42" width="68" height="36" rx="18"/><text class="chip-text bad" x="822" y="65" text-anchor="middle">error</text>
</svg>
